[project]
name = "vedit"
version = "0.1.0"
description = "Agent-first CLI that edits recordings of someone speaking into finished videos and short-form clips"
requires-python = ">=3.12"
dependencies = [
  "pyyaml",
  "numpy<2",
  "soundfile",
  "opencv-python-headless==4.10.0.84",
]

[project.scripts]
vedit = "vedit.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vedit"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["studio: real Studio integration (needs VEDIT_STUDIO_TESTS=1)"]
