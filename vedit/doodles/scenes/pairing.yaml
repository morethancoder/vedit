# C tools/doodles.py _pairing: you pair with a 6-char code, the bot connects your account to the session, and
# messages from anyone else are ignored
about: you -> /pair code -> bot -> your session; others' messages are ignored
lang: en
beats:
  you:
    - {pen: 0.8, shapes: [{person: {at: [300, 395], size: 112, fill: true}}]}
    - {text: "you", at: [300, 545], after: 0.6, size: 66}
  code:
    - pen: 0.9
      shapes:
        - arrow: {a: [392, 385], b: [470, 385], size: 20}
        - poly: {pts: [[532, 327], [890, 327], [890, 443], [532, 443], [492, 385]], fill: 0.22}
        - circle: {at: [527, 385], r: 9, lw: 0.9, amp: 0.3}
    - {text: "/pair a7k2xq", at: [718, 385], after: 0.55, size: 40, mono: true, weight: 700}
    - {text: "6-char code", at: [700, 493], after: 1.0, size: 50, color: soft}
  session:
    - {pen: next, shapes: [{arrow: {a: [910, 385], b: [978, 385], size: 20}}]}
    - {pen: 0.9, float: 4, shapes: [{bot: {at: [1098, 391], w: 180, h: 150}}]}
    - pen: 0.9
      after: 0.7
      shapes:
        - arrow: {a: [1222, 385], b: [1305, 385], size: 20}
        - laptop: {at: [1515, 379], w: 320, prompt: false}
        - check: {at: [1515, 377], k: 110, color: soft}
    - {text: "your session", at: [1515, 547], after: 1.3, size: 60}
  strangers:
    - {pen: 0.8, shapes: [{person: {at: [[845, 795], [1010, 795]], size: 84}}]}
    - pen: 0.6
      after: 0.55
      shapes:
        - arrow: {a: [868, 700], b: [968, 600], bend: -10, size: 20}
        - arrow: {a: [1018, 700], b: [1066, 604], bend: 8, size: 20}
    - {text: "others", at: [928, 905], after: 0.7, size: 50, color: soft}
  ignored:
    - pen: 0.6
      shapes:
        - cross: {at: [[1000.5269119345812, 567.4730880654188], [1086.571825392998, 562.8563492140039]], k: 19}
    - {text: "ignored", at: [1230, 600], after: 0.35, size: 64, color: warn}
