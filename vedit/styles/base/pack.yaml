# base: the neutral fallback every pack extends. Same layouts, slots and motion skeleton as the shipped packs
# (so a pack can extend it and only restyle), in a quiet palette: ivory text, a cool grey accent, no hand
# lettering. Arabic and Latin both set (IBM Plex Sans Arabic carries Latin too; JetBrains Mono for code).
# Marks telegram, octopus, spark live here so every pack accepts the same cues; their fills come from the theme.
# Sounds live here too (neutral clicks/whooshes, sfx/CREDITS.md); packs map them in `sfx:` with their own gains.
name: base
summary: neutral fallback; plain ivory text, quiet grey accent, every v1 type
keywords: [base, fallback, neutral, plain, minimal, grey, quiet, default]
lang: [ar, en]

colors:
  accent: "#C9D1D9"
  ivory: "#FAF9F5"
  ink: "#141414"
  night: "#101010"

fonts:
  - {family: "IBM Plex Sans Arabic", file: fonts/IBMPlexSansArabic-Regular.ttf, weight: 400}
  - {family: "IBM Plex Sans Arabic", file: fonts/IBMPlexSansArabic-Medium.ttf, weight: 500}
  - {family: "IBM Plex Sans Arabic", file: fonts/IBMPlexSansArabic-Bold.ttf, weight: 700}
  - {family: "JetBrains Mono", file: fonts/JetBrainsMono-Bold.ttf, weight: 700}
font:
  text: '"IBM Plex Sans Arabic", sans-serif'
  mono: '"JetBrains Mono", monospace'
  hand: '"IBM Plex Sans Arabic", sans-serif'  # no hand lettering in base
  # ui: the small lines (kicker, sub, chip label, step text); left out it follows `text`, set it to retarget them

# text themes, picked per cue by placement from the brightness behind the graphic (no boxes behind text)
themes:
  dark:
    text: "#FAF9F5"
    sub: "rgba(250,249,245,.88)"
    kicker: "#C9D1D9"
    shadow: "0 1px 2px rgba(0,0,0,.75), 0 2px 14px rgba(0,0,0,.6), 0 0 36px rgba(0,0,0,.5)"
    spark: "#FAF9F5"
    octo: "#FAF9F5"
    code: "#FAF9F5"
    prompt: "#C9D1D9"
  light:
    text: "#141414"
    sub: "#3A3A3A"
    kicker: "#4A5562"
    shadow: "0 1px 2px rgba(255,255,255,.7), 0 0 18px rgba(255,255,255,.8)"
    spark: "#141414"
    octo: "#141414"
    code: "#141414"
    prompt: "#4A5562"
# over a busy screen layout a denser halo keeps dark-theme letters readable (with the feathered blur)
busy_shadow: "0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.75), 0 2px 18px rgba(0,0,0,.75), 0 0 44px rgba(0,0,0,.7)"

# motion tokens, in templates as {{m.<key>}} (GSAP ease names; seconds; px for rise)
motion:
  ease_in: power3.out      # how things arrive
  ease_out: power2.in      # how things leave
  ease_draw: power2.inOut  # rules, underlines, strokes drawn on
  ease_pop: back.out(1.4)  # marks that land with an overshoot
  in: 0.55                 # a text line arriving
  out: 0.35                # small graphics leaving (label, chip, kinetic, blur)...
  out_lead: 0.42           # ...starting at D - out_lead
  scene_out: 0.45          # full-frame scenes and big words leaving...
  scene_lead: 0.55         # ...starting at D - scene_lead
  stagger: 0.08            # between lines arriving together
  rise: 16                 # px a line rises as it arrives

# big-number text metrics: advance per character in em for the big word's font (Plex Sans Arabic 700)
advances: plex700-advances.json
big: {track: -0.03, min_px: 110, max_px: 300, tuck: 0.45}

# marks that keep turning after they land (partials/logo_motion.html): none in base
logo_motion: {spin: []}

# full-frame moments: what the A-roll does behind them
focus: {blur: 20, brightness: 0.42, in: 0.3, out: 0.35}

# cue kind -> [sound, gain]: a sparse neutral map (soft clicks, one whoosh), quieter than the shipped packs
sfx:
  label: [click-soft, 0.22]
  chip: [key-press, 0.40]
  focus: [whoosh-short, 0.10]
  url: [click, 0.30]
# seconds per sound file (ffprobe), for every <audio data-duration>
sfx_files: {click-soft: 0.37, click: 0.37, key-press: 0.43, pop: 0.72, whoosh-short: 0.57}
