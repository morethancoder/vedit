<!-- Shared CSS for every sub-composition of claude-violet (C build.py base_css). Rendered with the cue's context.
     Arabic: no tracking (it would break the joins), taller lines for Naskh, no synthesized italic or bold. -->
<style>
      #root { position: absolute; inset: 0; font-family: {{&font.text}}; color: {{th.text}}; font-synthesis: none; }
      .kicker { font: 500 23px/1.2 {{&font.text}}; color: {{th.kicker}}; letter-spacing: .01em; text-shadow: {{&th.shadow}}; }
      .title { font: 600 54px/1.1 {{&font.serif}}; letter-spacing: -.02em; color: {{th.text}}; text-shadow: {{&th.shadow}}; }
      .title.mono { font: 700 50px/1.1 {{&font.mono}}; letter-spacing: -.01em; direction: ltr; }
      .sub { font: 400 25px/1.35 {{&font.text}}; color: {{th.sub}}; text-shadow: {{&th.shadow}}; }
      .logo { display: block; width: 50px; height: 50px; flex: none; }
      .mono { font-family: {{&font.mono}}; }
      [dir="rtl"] .kicker, [dir="rtl"].kicker { letter-spacing: 0; font-size: 25px; line-height: 1.35; }
      [dir="rtl"] .title, [dir="rtl"].title { letter-spacing: 0; line-height: 1.4; font-weight: 700; }
      [dir="rtl"] .sub, [dir="rtl"].sub { line-height: 1.5; }
</style>
